generations:
  - name: "First Generation (2021-2022)"
    start_year: 2021
    end_year: 2022
    description: "The Dacia Spring is a groundbreaking model that holds the distinction of being Europe's most affordable all-electric car. Based on the Renault Kwid/City K-ZE platform developed for emerging markets, it features a compact crossover-inspired design with a length of just 3.73 meters. The exterior styling incorporates SUV-like elements including increased ground clearance (151mm), roof rails, and protective body cladding, giving it a robust appearance despite its small dimensions. Powered by a modest 44 HP (33 kW) electric motor driving the front wheels, it prioritizes efficiency over performance, with 0-100 km/h acceleration taking around 19 seconds. The 27.4 kWh lithium-ion battery provides a WLTP range of approximately 230 km (143 miles) in the mixed cycle and up to 305 km (189 miles) in city driving. Charging options include standard household outlets (taking about 14 hours for a full charge), 7.4 kW wallboxes (5 hours), and DC fast charging up to 30 kW (80% in about 50 minutes). The interior is basic but functional, offering a 7-inch touchscreen infotainment system with smartphone connectivity in higher trims. Despite its compact exterior, it provides reasonable space for four adults and a 290-liter boot. Sales began in March 2021."

  - name: "First Generation (2022 Facelift)"
    start_year: 2022
    end_year: 2023
    description: "The 2023 Spring Electric, launched in June 2022, received a slight facelift on the front grille and a new badge on the rear, featuring the new Dacia logo and branding. The facelift included a redesigned front grille and updated styling cues. The vehicle retained the same 33 kW motor and 27.4 kWh battery, maintaining the 230 km WLTP range. In January 2023, Dacia launched the Spring Extreme version equipped with a 48 kW motor and a range of 220 km."

  - name: "First Generation (2024 Facelift)"
    start_year: 2024
    end_year: null
    description: "The refreshed Spring was unveiled on February 21, 2024, showcasing a revamped front and rear fascia designs, along with newly styled headlights and taillights. This generation update represents the most significant styling refresh since the model's introduction. The 2024 version was now produced in a right-hand drive format for UK and Irish markets, expanding the model's availability to left-side traffic regions. The vehicle continued to offer both the standard 33 kW motor and the Extreme variant with the 48 kW motor."
